name: APK Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Copie du jeu dans l'appli (version hors ligne)
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Construction de l'APK
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon
      - name: Renommage
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fighter-khey.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fighter Khey (Android) n°${{ github.run_number }}
          body: "Télécharge **fighter-khey.apk** ci-dessous et ouvre-le sur ton téléphone Android pour l'installer."
          files: fighter-khey.apk
          make_latest: true
